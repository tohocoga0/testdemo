$('#mp').onclick=()=>{CM--;if(CM<0){CM=11;CY--}cal()};$('#mn').onclick=()=>{CM++;if(CM>11){CM=0;CY++}cal()};const s=$('#cn');if(s)s.onchange=()=>{CNM=s.value;cal()}}
function confetti(x,y){x=x??innerWidth/2;y=y??innerHeight/3;for(let i=0;i<36;i++){const e=document.createElement('i');e.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:9px;height:14px;border-radius:3px;background:hsl(${Math.random()*360|0} 85% 70%);pointer-events:none;z-index:99;--dx:${(Math.random()-.5)*320}px;--dy:${120+Math.random()*260}px;--r:${Math.random()*720}deg;animation:cf 1.3s ease-out forwards`;document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}
let CS=0;
function cards(){const pool=cur(),ws=sh(pool.filter(w=>w.e)).concat(sh(pool.filter(w=>!w.e))).slice(0,8);let t=ws[0];
const nt=()=>{t=ws[Math.random()*ws.length|0];$('#ct').innerHTML=`Tìm thẻ có nghĩa: <b>${t.v}</b>`};
app.innerHTML=`<div class="card"><div class="score">⭐ <span id="cs">${CS}</span></div><div class="vi" id="ct"></div><button class="btn alt" id="lis">🔉 Nghe phát âm</button><div class="cg">${ws.map((w,i)=>`<button class="cc" data-i="${i}" style="animation-delay:${i*.12}s"><div style="font-size:3.4rem">${w.e||'💬'}</div><div class="zh" style="font-size:1.8rem;font-weight:700">${w.h}</div><div class="py" style="font-size:.95rem">${w.p}</div><div style="font-size:.95rem">${w.v}</div></button>`).join('')}</div></div>`;
nt();$('#lis').onclick=()=>say(t.h);
document.querySelectorAll('.cc').forEach(b=>b.onclick=e=>{const w=ws[b.dataset.i];say(w.h);if(w===t){CS++;ST++;rw();$('#cs').textContent=CS;confetti(e.clientX,e.clientY);nt()}else{b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');bad[t.h]=(bad[t.h]||0)+1}})}
(function(){const b=document.createElement('div');b.id='bgfx';b.style.cssText='position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none';
for(let i=0;i<4;i++){const c=document.createElement('div');c.className='cloud';c.style.top=(6+i*17)+'%';c.style.width=(100+i*30)+'px';c.style.animationDuration=(55+i*20)+'s';c.style.animationDelay=-(i*19)+'s';b.appendChild(c)}
for(let i=0;i<24;i++){const s=document.createElement('i');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*75}%;animation-delay:${Math.random()*3}s`;b.appendChild(s)}
setInterval(()=>{if(b.querySelectorAll('.bub').length>18)return;const u=document.createElement('i'),z=14+Math.random()*34;u.className='bub';u.style.cssText=`left:${Math.random()*100}%;width:${z}px;height:${z}px;animation-duration:${8+Math.random()*8}s`;u.onanimationend=()=>u.remove();b.appendChild(u)},900);document.body.prepend(b)})();
const PL=[['🌻','Hướng dương','#ffe08a','#ffc933'],['🌷','Tulip','#ffd1e3','#ff9bc2'],['🌹','Hoa hồng','#ffc9c9','#ff8f8f'],['🌺','Dâm bụt','#d9ccff','#b59cff'],['🌸','Anh đào','#ffd6e5','#ffb3cf'],['🌼','Cúc vàng','#fff3b0','#ffe066'],['🍀','Cỏ ba lá','#c9f2e3','#8fe0c0'],['🌵','Xương rồng','#d7f5c8','#a6e38a'],['🎋','Trúc gấu trúc','#c8ecff','#8fd3ff'],['🌴','Dừa','#ffe0c2','#ffbf80'],['🪴','Cây lá xanh','#e3d9ff','#c4b0ff']];
const FM=[['Mời người nhà ngồi cạnh và hỏi, người nhà đáp lại|我可以坐这儿吗？可以，请坐。','Bé lỡ làm một việc nhỏ rồi xin lỗi, người nhà đáp|对不起！没关系。'],['Hỏi người nhà dậy lúc mấy giờ rồi kể lại|你早上几点起床？我七点起床。','Cùng đọc vè và vẫy tay: 7 giờ thức dậy, 9 giờ đi ngủ|快快起床！快快睡觉！'],['Người nhà giấu một cây bút chì, bé hỏi để tìm|你的铅笔呢？在书包里。','Cùng chỉ đồ vật trong nhà và gọi tên|桌子，椅子，床，电视。'],['Hỏi màu cặp sách của nhau|你的书包是什么颜色的？红色的。','Tìm đồ vật màu đỏ, vàng, xanh lá trong nhà và nói tên màu|红色，黄色，绿色。'],['Hỏi người nhà có biết nấu ăn không, rồi khen món ăn|你会不会做饭？这个真好吃！','Nói nghề nghiệp của người nhà (bác sĩ hoặc đầu bếp)|我爸爸是医生。'],['Chơi bán hàng bằng đồ chơi: hỏi giá|包子多少钱一个？两块钱一个。','Than đắt quá khi trả giá|太贵了！'],['Hỏi người nhà thích uống nước nóng hay nước đá|我觉得冰水好喝。','Nhìn trời và nói hôm nay nóng hay lạnh hơn hôm qua|今天比昨天热。'],['Đứng cạnh nhau so ai cao hơn|我比你高。','Giới thiệu người thân: em cũng là học sinh|弟弟也是学生。'],['Hỏi hôm nay người nhà ăn trái cây gì|你吃了什么水果？我吃了一个香蕉。','Cùng vẽ gấu trúc rồi khoe|我画熊猫了！'],['Đóng vai bác sĩ và bệnh nhân|你怎么了？我脚疼。','Hỏi thăm khi hết đau|现在不疼了吗？不疼了！'],['Cùng kể một ngày Chủ nhật của bé|早上，中午，下午，晚上。','Nhìn đồng hồ và hỏi giờ|现在几点了？三点零五了。']];
const GDS=(()=>{try{return JSON.parse(localStorage.getItem('yct_garden')||'{}')}catch(e){return {}}})(),G=()=>GDS[NAME]||(GDS[NAME]={lrn:[],used:0,grow:{},fam:[]}),save=()=>{try{localStorage.setItem('yct_garden',JSON.stringify(GDS))}catch(e){}},wt=()=>{const g=G();return g.lrn.length-g.used};let NOTE='',NL=null;
rw=()=>{$('#rwd').textContent=`${bd()} ${ST} sao · 💧 ${wt()} · 🔥 ${STK} ngày`};
lsb.lastChild.remove();
const pot=(a,b)=>`<svg viewBox="0 0 100 70" width="90"><path d="M16 16h68l-7 46a8 8 0 0 1-8 7H31a8 8 0 0 1-8-7z" fill="${a}"/><rect x="10" y="8" width="80" height="14" rx="7" fill="${b}"/><circle cx="38" cy="42" r="4" fill="#3a3350"/><circle cx="62" cy="42" r="4" fill="#3a3350"/><circle cx="29" cy="50" r="5" fill="#ff9bb3" opacity=".7"/><circle cx="71" cy="50" r="5" fill="#ff9bb3" opacity=".7"/><path d="M43 49q7 7 14 0" stroke="#3a3350" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
const plant=(i,s)=>`<div class="pw"><div class="pe" style="font-size:${[26,32,40,52][s]}px">${['🌰','🌱','🌿',PL[i][0]+'✨'][s]}</div>${pot(PL[i][2],PL[i][3])}</div>`;
const GE={pic:()=>quiz('pic'),ear:()=>quiz('ear'),build,balloon:g4,memory:g5,mole:g6,tilt:g7,cards,clock:()=>qz('Xem giờ',ck),money:()=>qz('Mua bán',mg),exam},GN={pic:'🎮 Chọn chữ',ear:'👂 Nghe chọn',build:'🧩 Ghép câu',balloon:'🎈 Bong bóng',memory:'🔍 Lật thẻ',mole:'🐹 Đập chuột',tilt:'📱 Nghiêng máy',cards:'🌈 Tìm thẻ',clock:'🕐 Xem giờ',money:'💰 Mua bán',exam:'📝 Kiểm tra'},GL=['tilt build','clock ear','mole memory','balloon cards','pic build','money exam','tilt ear','memory build','mole cards','pic exam','clock build'];
const tl2=()=>[['ls','📖 Học từ'],['wr','✍️ Tập viết'],...GL[L].split(' ').map(k=>['g_'+k,GN[k]]),...(CH[L]?[['ch','🎵 Vè']]:[]),...(SO[L]?[['st','📖 Truyện']]:[]),['fam','👨‍👩‍👧 Học cùng người nhà'],['gd','☁️ Vườn mây'],['cl','📅 Lịch'],['rs','📤 Kết quả']];
function buildNav(){nav.innerHTML='';tl2().forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.k=k;b.onclick=()=>go(k);nav.appendChild(b)})}
go=function(k){stop();if(L<0)L=0;if(k!=='tc'&&!tl2().some(t=>t[0]===k))k='ls';tab=k;if(NL!==L){NL=L;buildNav()}[...nav.children].forEach(b=>b.classList.toggle('on',b.dataset.k===k));[...lsb.children].forEach((b,i)=>b.classList.toggle('on',L===i));const m={ls:list2,wr,ch:chant,st:story,fam,gd:garden,cl:cal,rs:rep,tc:teach};(k.startsWith('g_')?GE[k.slice(2)]:m[k])()};
function learn(w){const g=G(),k=L+w.h;if(g.lrn.includes(k))return;g.lrn.push(k);say(w.h);ST++;NOTE='💧 +1 bình nước!';if(cur().every(x=>g.lrn.includes(L+x.h))&&g.grow[L]===undefined){g.grow[L]=0;NOTE='🎁 Xong '+D[L][0]+'! Bé nhận được cây '+PL[L][0]+' '+PL[L][1]+'. Sang ☁️ Vườn mây để trồng nhé!';confetti()}save();rw();list2()}
function list2(){const ws=cur(),g=G();list();const n=NOTE;NOTE='';app.insertAdjacentHTML('afterbegin',`<div class="card" style="margin-bottom:10px${n?';background:#fff3b0;color:#3a3350':''}"><div class="vi">${n||'💧 Học xong mỗi từ được 1 bình nước'}</div><div class="score">${ws.filter(w=>g.lrn.includes(L+w.h)).length}/${ws.length} từ đã học · 💧 ${wt()}</div></div>`);document.querySelectorAll('[data-s]').forEach(b=>{const w=ws[b.dataset.s],dn=g.lrn.includes(L+w.h),x=document.createElement('button');x.className='btn'+(dn?' ghost':'');x.textContent=dn?'✅':'💧 Xong';x.disabled=dn;x.onclick=()=>learn(w);b.after(x)})}
function garden(){const g=G();app.innerHTML=`<div class="card"><h2>☁️ Vườn mây của ${NAME}</h2><div class="score">💧 ${wt()} bình nước · 🌱 ${Object.keys(g.grow).length}/${D.length} cây</div><div class="sky2">${D.map((d,i)=>{const s=g.grow[i];return s===undefined?`<div class="slot2"><div style="font-size:2.2rem;opacity:.5">🔒</div><div class="isl"></div><div class="mut">${d[0]}</div></div>`:`<button class="slot2" data-i="${i}">${plant(i,s)}<div class="isl"></div><div style="font-weight:700">${PL[i][1]}</div><div class="mut">${s>=3?'🎉 Đã nở hoa':'Chạm để tưới 💧 '+s+'/3'}</div></button>`}).join('')}</div><div class="vi" id="gm" style="min-height:30px"></div><p class="mut">Học xong 1 từ = 1 bình nước. Học xong 1 bài = 1 cây mới.</p></div>`;document.querySelectorAll('[data-i]').forEach(b=>b.onclick=e=>{const i=+b.dataset.i;if(g.grow[i]>=3)return confetti(e.clientX,e.clientY);if(wt()<=0)return $('#gm').textContent='Hết nước rồi, hãy học thêm từ mới nhé! 💧';g.used++;g.grow[i]++;save();rw();confetti(e.clientX,e.clientY);garden()})}
function fam(){const g=G();g.fam=g.fam||[];app.innerHTML=`<div class="card"><h2>👨‍👩‍👧 HỌC CÙNG NGƯỜI NHÀ</h2><p class="mut">${D[L][0]} · Mời bố mẹ, ông bà, anh chị cùng làm với bé.</p><input id="fn" placeholder="Tên người cùng học" value="${g.fn||''}" style="width:100%;font-size:1.1rem;padding:10px;border-radius:12px;border:3px solid var(--line);background:var(--card);color:var(--ink)">${FM[L].map((t,i)=>{const[v,z]=t.split('|'),k=L+'-'+i,dn=g.fam.includes(k);return `<div class="ex" style="text-align:left;margin-top:8px"><div>${v}</div><div class="z zh">${z}</div><div class="row" style="justify-content:flex-start"><button class="btn alt" data-z="${i}">🔊 Nghe mẫu</button><button class="btn${dn?' ghost':''}" data-k="${k}">${dn?'✅ Đã làm cùng':'Đã làm cùng người nhà'}</button></div></div>`}).join('')}</div>`;$('#fn').oninput=e=>{g.fn=e.target.value;save()};document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>say(FM[L][b.dataset.z].split('|')[1]));document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,j=g.fam.indexOf(k);j<0?g.fam.push(k):g.fam.splice(j,1);save();fam()})}
rw();
go('ls');

</script>
